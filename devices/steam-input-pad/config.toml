[source]
kind = "curated"
origin = "project-local"
notes = "Steam Input's virtual gamepad — a uinput device Steam creates while it remaps a physical controller. Steam EVIOCGRABs the real pad and republishes it here, so this node is the live one whenever Steam Input is on. It impersonates 'Microsoft X-Box 360 pad N' with Valve's VID:PID, and is grouped into 'xbox-controller' so bindings follow the controller across that handoff."
