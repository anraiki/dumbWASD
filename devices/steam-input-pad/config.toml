notes = "Steam Input's virtual gamepad — a uinput device Steam creates while it remaps a physical controller. It impersonates 'Microsoft X-Box 360 pad N' with Valve's VID:PID, so it is renamed here to avoid confusion with real hardware. It only exists while Steam is running."
